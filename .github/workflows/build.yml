name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - name: Name universal APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CandyBarAdventure-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CandyBarAdventure-universal-apk
          path: CandyBarAdventure-universal.apk
      - name: Publish GitHub release v1.0 (once)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=1.0
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER already exists, skipping"; exit 0
          fi
          cp CandyBarAdventure-universal.apk "CandyBarAdventure-${VER}-universal.apk"
          gh release create "v$VER" "CandyBarAdventure-${VER}-universal.apk" \
            --target "$GITHUB_SHA" \
            --title "Candy Bar Adventure $VER" \
            --notes "First release. Universal APK (arm64-v8a, armeabi-v7a, x86, x86_64). Package: com.kuznix.candybar.adventure"
